# Advisories this repository has read and settled, for OSV-Scanner.
#
# THE SCANNER READS THIS FILE FOR THE FILES IN THIS FOLDER ONLY. It does not carry it into
# subfolders - the scanner's own documentation for v2.6.0 says so, and it was measured with v2.6.0
# on 2026-10-16 and again with the pinned v2.7.0 on 2026-10-26: the same entry one folder up from
# the list left both advisories in the report, and in this folder it filtered them. That is on purpose
# here, because the canary files in osv-scanner/ must keep coming back vulnerable. The one file
# .github/workflows/osv-scanner.yml scans in this folder is semgrep.installed.txt, which it writes
# from what pip would install for semgrep, so every entry below is about a package semgrep brings.
#
# .github/scripts/osv_gate.py blocks on every advisory this file does not settle. So each entry
# carries its reason and a date it stops applying, and after that date the gate is red again - the
# entry is then removed, or written again with a reason that is still true. Measured the same day:
# an entry whose date has passed is reported by the scanner as unused, and the advisory comes back.

[[IgnoredVulns]]
id = "GHSA-84m7-p3x7-pcfv"
ignoreUntil = 2026-11-16
reason = "mcp 1.29.0 is here only because semgrep requires it, and CI runs semgrep as semgrep scan. The advisory is about an MCP server over Streamable HTTP, and nothing in this repository serves MCP. The fix is mcp 1.30.0, but every semgrep release from 1.180.0 to 1.182.1 requires mcp==1.29.0 exactly (read on the package index on 2026-10-26), so pip cannot install it. Remove this entry once a semgrep release allows mcp 1.30.0 or later."

[[IgnoredVulns]]
id = "GHSA-xcq7-p3pf-p88h"
ignoreUntil = 2026-11-16
reason = "opentelemetry-api 1.37.0 is here only because semgrep requires opentelemetry-api~=1.37.0, which excludes every release from 1.38 up. The advisory is a denial of service through a slow regular expression in TraceState.from_header, reached when server instrumentation passes an incoming tracestate header to the propagator. CI runs semgrep as a one-off command line scan with metrics off (.github/workflows/security.yml, the semgrep scan step), so it serves no HTTP and receives no such header. The fix is opentelemetry-api 1.45.1, which pip cannot install next to the pinned semgrep. Remove this entry once a semgrep release allows opentelemetry-api 1.45.1 or later."
