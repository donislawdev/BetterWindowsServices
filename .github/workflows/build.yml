# The first thing in this project that runs the checks without somebody remembering to.
#
# WHAT IT IS FOR: a lot of code was being written and nothing was checking it on its own.
# Five hundred and thirty tests, a mutation registry and two bridge scripts existed before this
# file, and every one of them ran only when somebody chose to run it. A check that depends on
# somebody's memory is a check with a bad day built into it.
#
# WHAT IT CANNOT DO, and this is not a limitation of continuous integration - it follows
# directly from decisions recorded in CLAUDE.md:
#
#   Points 11 and 12 of the definition of done are tools/mutate/mutate.ps1 and
#   tools/audit/audit.ps1. BOTH LIVE IN tools/, WHICH IS OUTSIDE THE REPOSITORY. A checkout
#   gets the code and the tests and nothing else, so this workflow carries TEN of the twelve
#   points, not twelve. Mutation and the document bridge stay with the owner.
#
#   tools/gui-probe/check.ps1 is a third one it cannot carry, for a different reason: it needs
#   a desktop session, a real window and a service to move.
#
# MEASURED BEFORE THIS FILE WAS WRITTEN, rather than assumed: a fresh clone into a temporary
# directory builds with zero warnings and passes all 530 tests. So this is not aspirational.

name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build and the tests that do not need this machine
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: restore
        run: dotnet restore BetterWindowsServices.slnx

      # Warnings are already errors, set once in Directory.Build.props rather than here - a
      # second place saying it would be a second place to change and a first place to forget.
      - name: build
        run: dotnet build BetterWindowsServices.slnx -c Release --no-restore

      # THREE PROJECTS, NOT FOUR, and the missing one is deliberate.
      #
      # Bws.Integration.Tests reads the live service control manager of whatever machine it runs
      # on, compares against that machine's sc.exe, and holds performance budgets from section
      # 8.1 of the specification. A runner is a different machine: fewer services, different
      # rights, and two or four processors where docs/04 already records that the snapshot
      # budget lands at 99.6% of its promise on two. Those tests belong on a machine somebody
      # can look at, and there is a job below for asking a runner what it thinks.
      #
      # A guard that goes red for reasons unrelated to the change teaches people to ignore it,
      # which is worse than not having it. That sentence is in docs/04 about a different test
      # and it applies here without modification.
      # ONE PROJECT PER STEP, AND THAT IS A FIX RATHER THAN A LAYOUT PREFERENCE.
      #
      # These three used to be three lines of one `run:` block, and in that shape the step
      # reported the exit code of the LAST command only. GitHub runs a `run:` block as
      # `pwsh -command ". 'script.ps1'"` with `$ErrorActionPreference = 'stop'` and an appended
      # `exit $LASTEXITCODE` - and that preference governs PowerShell cmdlets, not the exit code
      # of a native program. `dotnet test` is a native program.
      #
      # MEASURED 2026-08-03 by reproducing the documented shell shape locally on pwsh 7.6.4: a
      # first command exiting 1 did not stop the script, the second still ran, and the runner
      # would have seen 0. So a red Bws.Core.Tests - 325 of the 401 tests that run here - passed
      # this workflow as long as the GUI project was green.
      #
      # Separate steps have no such rule to remember. Each one is its own exit code, and a
      # failure names which project failed in the job summary rather than in a log somebody has
      # to open.
      - name: tests that hold anywhere - core
        run: dotnet test tests/Bws.Core.Tests/Bws.Core.Tests.csproj -c Release --no-build --nologo --logger "trx;LogFileName=core.trx" --results-directory results

      - name: tests that hold anywhere - architecture
        run: dotnet test tests/Bws.Architecture.Tests/Bws.Architecture.Tests.csproj -c Release --no-build --nologo --logger "trx;LogFileName=architecture.trx" --results-directory results

      - name: tests that hold anywhere - window
        run: dotnet test tests/Bws.Gui.Tests/Bws.Gui.Tests.csproj -c Release --no-build --nologo --logger "trx;LogFileName=window.trx" --results-directory results

      # THE PART OF THE INTEGRATION PROJECT THAT IS NOT ABOUT THIS MACHINE, added 2026-08-03.
      #
      # The whole project used to sit out, and the reason given covered only part of it. Comparing
      # against a machine's own sc.exe and holding the budgets from section 8.1 really are facts
      # about one machine. Asking whether `bws --help` ends with code zero is not - and it went
      # unchecked on every push for the same reason, which is how that exact fault lived through
      # the whole life of the product once already.
      #
      # OPT IN RATHER THAN OPT OUT, and that is deliberate. A test written tomorrow does not join
      # this step until somebody marks it, so a new test that quietly depends on the machine it
      # was written on cannot turn this job red for a reason unrelated to the change. docs/04 says
      # a guard that goes red for the wrong reason teaches people to ignore it, and that costs
      # more than the coverage is worth.
      - name: tests that hold anywhere - the command line surface
        run: dotnet test tests/Bws.Integration.Tests/Bws.Integration.Tests.csproj -c Release --no-build --nologo --filter "runs=anywhere" --logger "trx;LogFileName=surface.trx" --results-directory results

      # SOMETHING TO OPEN WHEN A RUN GOES RED, which until 2026-08-03 there was not: a failed
      # job left a log in a web page and nothing to take away from it.
      #
      # On failure only. A green run has nothing anybody wants, and an artifact uploaded on every
      # push is storage spent to make the interesting case slightly easier to find.
      #
      # `if: failure()` rather than `always()` for the same reason, and it runs even though the
      # steps above stop the job - that is what the condition is for.
      - name: what the failing run said
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: results
          retention-days: 14

      # Publishing is its own failure mode and the build does not cover it. Section S9 of the
      # specification promises a small self-contained file, and the measured 93.5 MB is already
      # a problem written down as backlog item 6 - but a publish that stops working entirely is
      # a different and worse surprise, and this is the cheapest place to find out.
      - name: the single file still publishes
        run: dotnet publish src/Bws.Cli/Bws.Cli.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true

  live-machine:
    name: what a different machine says about the integration tests
    runs-on: windows-latest

    # BY HAND ONLY, and that is the point of this job rather than a hedge.
    #
    # It is an INSTRUMENT, not a gate. Every number in this project's documents is a fact about
    # one machine - 810 entries, 544 distinct files, sixteen processors - and docs/04 says
    # plainly that a figure without its subject is a claim with no content. This job is the
    # cheapest way to ask a second machine the same questions, and the answers are worth
    # reading precisely because they will differ.
    #
    # It is not on every push because a red mark that everybody knows to ignore is worse than
    # no mark. If it turns out to be steady, it graduates into the job above with a note saying
    # what was measured before it was trusted.
    if: github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: build
        run: dotnet build BetterWindowsServices.slnx -c Release

      - name: the tests that read a real service control manager
        run: dotnet test tests/Bws.Integration.Tests/Bws.Integration.Tests.csproj -c Release --no-build --nologo
