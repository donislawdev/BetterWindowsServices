# OSV-Scanner - every package this repository builds or runs, asked against the OSV database.
#
# The owner's decision of 2026-10-14, in his words: scan on every pull request and block it if
# anything is found, and scan the repository once a week, with whatever is found going to the
# Security tab. The pull request half is the job named OSV-Scanner, and it only blocks a merge
# because that name is a REQUIRED check in the rules of main - a red check that is not required
# is a suggestion. The Security tab half is the second job, on the weekly schedule and on every
# push to main, so that an alert fixed by a merged pull request closes the same day rather than a
# week later (also his decision, the same day).
#
# WHAT THIS ADDS TO WHAT WAS ALREADY HERE, said so that a second green check is not read as more
# than it is. NuGet packages with an advisory already fail `dotnet restore` on every push, through
# the NuGetAudit settings SupplyChainGuards holds, and the advisories come from GitHub's database,
# which OSV imports. So for NuGet this is a second opinion from largely the same source. What is
# new is the Python side - the packages the Semgrep job installs - the Security tab, and a weekly
# look at code nobody touched, the argument codeql.yml makes for its own schedule.
#
# NOTHING HERE IS FOUND BY SEARCHING THE TREE, and each half of that was measured on 2026-10-14
# rather than assumed. OSV-Scanner does not read .csproj files at all, and this repository commits
# no lock file, so the restore below writes one per project and the scan names each of them. And
# asked to resolve semgrep==1.180.0 by itself, the scanner reported eleven advisories in versions
# of three packages that pip does not install - so the workflow asks pip what it WOULD install and
# scans exactly that, with resolution off. .github/scripts/osv_gate.py carries both measurements.
#
# THE VERDICT IS NOT THE SCANNER'S EXIT CODE, for the reason security.yml gives about semgrep. The
# gate reads the report, refuses one that did not read every file it was meant to, and refuses a
# run whose canary - two packages with old published advisories - came back clean.
name: OSV-Scanner

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Monday morning, an hour before CodeQL's weekly run, so that the two weekly answers arrive
  # together rather than on different days of somebody's week.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read # checkout only - nothing in this workflow pushes, comments or labels

concurrency:
  group: osv-scanner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    # THIS NAME IS THE REQUIRED CHECK. Renaming the job renames the check, and a required check
    # nobody runs any more blocks every pull request - change the rules of main in the same breath.
    name: OSV-Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Read only. This job runs code that is not ours - a restore, pip resolving a requirements
    # file, the scanner image - so it holds nothing that can write. Uploading to the Security tab
    # is the job below, which runs none of it.
    outputs:
      sarif: ${{ steps.handover.outputs.sarif }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # The Python the Semgrep job uses. pip's answer depends on it - starlette, for one, asks for
      # a different minimum from Python 3.14 on.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: The scanner, pinned by digest
        # The Dockerfile says why the scanner is an image named by its digest rather than the
        # scanner's own action, and why that line lives in a file instead of here.
        run: docker build --quiet --tag osv-scanner-pinned .github/osv-scanner

      - name: Canary
        # The checkout is mounted read only, and at its own path, so that every path the scanner
        # reports is the runner's own and can be matched against what git tracks.
        run: |
          set +e
          docker run --rm -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" -w "$GITHUB_WORKSPACE" osv-scanner-pinned \
            scan source --format json --no-resolve \
            --lockfile=packages.lock.json:./.github/osv-scanner/canary-nuget.lock.json \
            --lockfile=requirements.txt:./.github/osv-scanner/canary-pip.txt \
            > "$RUNNER_TEMP/canary.json"
          code=$?
          set -e
          echo "osv-scanner exit code: $code"
          if [ "$code" -gt 1 ]; then exit "$code"; fi
          python .github/scripts/osv_gate.py canary "$RUNNER_TEMP/canary.json"

      - name: Lock files, written by restore for this scan only
        # Nothing here is committed - the owner's decision of 2026-10-14, because GitHub's own
        # dependency graph does not read these files either. EnableWindowsTargeting because this
        # runner is Linux and every project targets Windows. NuGetAudit off FOR THIS RESTORE ONLY,
        # because with it on, the first package with an advisory stops the restore before the lock
        # files are written, and the scanner - the one judging here - would get nothing to read.
        # build.yml restores with the audit on, as Directory.Build.props states.
        run: >-
          dotnet restore BetterWindowsServices.slnx
          -p:RestorePackagesWithLockFile=true
          -p:EnableWindowsTargeting=true
          -p:NuGetAudit=false

      - name: What pip would install for semgrep
        # --dry-run installs nothing, and --report says what it would have installed. The gate
        # turns that into the list the scan reads, and refuses an answer that has no semgrep in it.
        run: |
          python -m pip install --dry-run --ignore-installed --quiet \
            --report "$RUNNER_TEMP/pip-report.json" -r .github/requirements-semgrep.txt
          python .github/scripts/osv_gate.py pins "$RUNNER_TEMP/pip-report.json" .github/semgrep.installed.txt

      - name: Scan
        # One lock file per project git tracks, named rather than searched for, and the gate asks
        # git for the same list - so a project whose lock file was never written is a refusal, not
        # a smaller scan. JSON for the gate, SARIF for the Security tab.
        run: |
          args=()
          while IFS= read -r project; do
            args+=("--lockfile=packages.lock.json:./$(dirname "$project")/packages.lock.json")
          done < <(git ls-files -- '*.csproj')
          args+=("--lockfile=requirements.txt:./.github/semgrep.installed.txt")
          scan() {
            docker run --rm -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" -w "$GITHUB_WORKSPACE" osv-scanner-pinned \
              scan source --no-resolve "${args[@]}" "$@"
          }
          set +e
          scan --format json --all-packages > "$RUNNER_TEMP/osv.json"
          json=$?
          scan --format sarif > "$RUNNER_TEMP/osv.sarif"
          sarif=$?
          set -e
          echo "osv-scanner exit codes: json $json, sarif $sarif"
          if [ "$json" -gt 1 ]; then exit "$json"; fi
          if [ "$sarif" -gt 1 ]; then exit "$sarif"; fi

      - name: Point every alert at a file the repository has
        # The lock files and the pip list exist only in this job, so an alert left pointing at
        # one would point at nothing. Each location moves to the tracked file behind it - the
        # project's .csproj, or the requirements file - and a location that belongs to neither is
        # refused. On every event, a pull request included, so that a change which breaks this
        # step is red before it is merged rather than on the first push to main. A review of
        # pull request 62 asked for it.
        run: >-
          python .github/scripts/osv_gate.py sarif "$RUNNER_TEMP/osv.sarif"
          --pins .github/semgrep.installed.txt
          --pins-from .github/requirements-semgrep.txt

      # Handed over BEFORE the verdict, so that a scan which found something still reaches the
      # Security tab - that is the case the tab exists for. Never on a pull request.
      - name: Hand the SARIF to the job that may write it
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: osv-sarif
          path: ${{ runner.temp }}/osv.sarif
          if-no-files-found: error
          retention-days: 7

      - name: Mark the hand-over
        id: handover
        if: github.event_name != 'pull_request'
        run: echo "sarif=written" >> "$GITHUB_OUTPUT"

      - name: Verdict
        run: python .github/scripts/osv_gate.py verdict "$RUNNER_TEMP/osv.json" --pins .github/semgrep.installed.txt

  report:
    name: OSV-Scanner report
    needs: scan
    # Also when the scan failed on what it found, and only when it got as far as handing a report
    # over - a canary that failed leaves nothing worth uploading, and a cancelled run neither.
    if: always() && needs.scan.outputs.sarif == 'written'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # The one write scope in this workflow, held by a job that runs no package, no resolver and no
    # image - only GitHub's own actions, on a file the job above wrote.
    permissions:
      contents: read # the checkout, which the upload also needs while a repository is private
      actions: read # the upload needs it only while a repository is private - kept, as codeql.yml keeps it
      security-events: write # the upload itself, the only write in this workflow

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: osv-sarif
          path: ${{ runner.temp }}/osv

      # Its own category, so these alerts never replace CodeQL's and CodeQL's never replace these.
      # An upload with no results is what closes an alert that a merged fix made obsolete.
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: ${{ runner.temp }}/osv/osv.sarif
          category: osv-scanner
